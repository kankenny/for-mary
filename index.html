<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000" />
    <link rel="icon" type="image/png" href="media/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Goodbye</title>
  </head>

  <body>
    <video autoplay muted playsinline preload="auto" poster="media/poster.jpg">
      <source src="media/scene1.mp4" type="video/mp4" />
    </video>

    <button class="cue" aria-label="play sound">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path
          d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <script>
      const FADE = 10;
      const SKIP = 1.5;
      const WAIT = 8;
      const DIP = 0.35;
      const tracks = [
        {
          src: "media/Hero.mp3",
          level: 1,
          title: "Hero",
          artist: "Regina Spektor",
        },
        {
          src: "media/All I Want.mp3",
          level: 0.88,
          title: "All I Want",
          artist: "Kodaline",
        },
        {
          src: "media/Easily.mp3",
          level: 0.5,
          title: "Easily",
          artist: "Bruno Major",
        },
        {
          src: "media/To Let A Good Thing Die.mp3",
          level: 1,
          title: "To Let a Good Thing Die",
          artist: "Bruno Major",
        },
        {
          src: "media/Quelqu'un m'a dit.mp3",
          level: 0.65,
          title: "Quelqu'un m'a dit",
          artist: "Carla Bruni",
        },
        {
          src: "media/Lost Stars.mp3",
          level: 1.68,
          title: "Lost Stars",
          artist: "Keira Knightley",
        },
        {
          src: "media/Jealous.mp3",
          level: 0.87,
          title: "Jealous",
          artist: "Labrinth",
        },
        {
          src: "media/K.mp3",
          level: 0.8,
          title: "K.",
          artist: "Cigarettes After Sex",
        },
        {
          src: "media/Apocalypse.mp3",
          level: 0.55,
          title: "Apocalypse",
          artist: "Cigarettes After Sex",
        },
        {
          src: "media/Only Hope.mp3",
          level: 0.92,
          title: "Only Hope",
          artist: "Switchfoot",
        },
        {
          src: "media/Second Time.mp3",
          level: 0.61,
          title: "Second Time",
          artist: "Bruno Major",
        },
      ];
      const unlock = [
        "pointerdown",
        "pointerup",
        "touchend",
        "click",
        "keydown",
      ];

      const video = document.querySelector("video");
      const cue = document.querySelector(".cue");

      if (navigator.audioSession) navigator.audioSession.type = "playback";

      const SILENCE =
        "data:audio/wav;base64,UklGRogAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWQAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";

      const ctx = new AudioContext();
      const decks = [0, 1].map(() => {
        const el = new Audio();
        el.preload = "auto";
        const gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(el).connect(gain).connect(ctx.destination);
        return { el, gain, track: -1, unlocked: false };
      });

      let current = 0;
      let live = 0;
      let fading = false;
      let started = false;
      let held = [];
      let eager = false;

      const active = () => decks[live];
      const idle = () => decks[1 - live];
      const session = navigator.mediaSession;

      function load(deck, k) {
        if (deck.track === k) return;
        deck.track = k;
        deck.el.src = encodeURI(tracks[k].src);
      }

      load(decks[0], 0);

      function nowPlaying({ title, artist }) {
        if (!session) return;
        session.metadata = new MediaMetadata({
          title,
          artist,
          artwork: [{ src: "media/poster.jpg", type: "image/jpeg" }],
        });
      }

      function position() {
        const { el } = active();
        if (!session?.setPositionState || !el.duration) return;
        session.setPositionState({
          duration: el.duration,
          position: Math.min(el.currentTime, el.duration),
          playbackRate: 1,
        });
      }

      const rise = Array.from({ length: 256 }, (_, i) =>
        Math.sin(((i / 255) * Math.PI) / 2),
      );
      const fall = [...rise].reverse();

      function ramp(param, shape, length, scale = 1) {
        const t = ctx.currentTime;
        param.cancelScheduledValues(t);
        param.setValueCurveAtTime(
          Float32Array.from(shape, (v) => v * scale),
          t,
          length,
        );
      }

      function slide(param, to, length) {
        const t = ctx.currentTime;
        param.cancelScheduledValues(t);
        param.setValueAtTime(param.value, t);
        param.linearRampToValueAtTime(to, t + length);
      }

      function start(el) {
        return Promise.race([
          el.play().then(() => true, () => false),
          new Promise((r) => setTimeout(r, WAIT * 1000, null)),
        ]).then((ok) => {
          if (ok === null) el.pause();
          return ok;
        });
      }

      async function crossfade(step = 1, length = FADE, manual = false) {
        fading = true;
        const out = active();
        const next = idle();
        const count = tracks.length;
        let found = false;

        if (manual) slide(out.gain.gain, DIP * tracks[current].level, 0.4);

        for (let n = 1; n < count; n++) {
          const k = (((current + step * n) % count) + count) % count;
          load(next, k);
          next.gain.gain.cancelScheduledValues(ctx.currentTime);
          next.gain.gain.value = 0;
          next.el.currentTime = 0;
          const ok = await start(next.el);
          if (ok) {
            current = k;
            found = true;
            break;
          }
          if (ok === null || !next.el.error) break;
        }

        if (!found) {
          slide(out.gain.gain, tracks[current].level, 0.4);
          fading = false;
          return;
        }

        live = 1 - live;
        nowPlaying(tracks[current]);
        position();
        ramp(next.gain.gain, rise, length, tracks[current].level);
        ramp(out.gain.gain, fall, length, out.gain.gain.value);

        const end = ctx.currentTime + length;
        const settle = () => {
          const left = end - ctx.currentTime;
          if (left > 0.05) return setTimeout(settle, left * 1000 + 50);
          out.el.pause();
          fading = false;
          if (active().el.error) return crossfade();
          if (eager) load(idle(), (current + 1) % count);
        };
        setTimeout(settle, length * 1000 + 200);
      }

      function pause() {
        held = decks.filter((d) => !d.el.paused);
        held.forEach((d) => d.el.pause());
        ctx.suspend();
        if (session) session.playbackState = "paused";
      }

      function resume() {
        ctx.resume();
        (held.length ? held : [active()]).forEach((d) => d.el.play());
        held = [];
        if (session) session.playbackState = "playing";
      }

      function skip(step) {
        if (!started || fading) return;
        if (ctx.state !== "running") resume();
        eager = true;
        crossfade(step, SKIP, true);
      }

      function back() {
        const { el } = active();
        if (el.currentTime > 3) el.currentTime = 0;
        else skip(-1);
      }

      if (session) {
        const actions = {
          play: resume,
          pause,
          nexttrack: () => skip(1),
          previoustrack: back,
          seekto: ({ seekTime }) => {
            active().el.currentTime = seekTime;
          },
        };
        for (const [action, handler] of Object.entries(actions)) {
          try {
            session.setActionHandler(action, handler);
          } catch {}
        }
      }

      decks.forEach((d) => {
        d.el.addEventListener("timeupdate", () => {
          if (d !== active() || fading || !d.el.duration) return;
          const left = d.el.duration - d.el.currentTime;
          if (left <= FADE + 30) load(idle(), (current + 1) % tracks.length);
          if (left <= FADE) crossfade();
        });
        for (const type of ["ended", "error"]) {
          d.el.addEventListener(type, () => {
            if (d === active() && started && !fading) crossfade();
          });
        }
        for (const type of ["playing", "seeked", "durationchange"]) {
          d.el.addEventListener(type, () => {
            if (d === active()) position();
          });
        }
      });

      function begin() {
        if (started) return;
        if (video.paused && !video.ended) video.play().catch(() => {});
        ctx.resume();
        const [first, second] = decks;
        if (!second.unlocked) {
          if (!second.el.src) second.el.src = SILENCE;
          second.el.play().then(
            () => {
              second.unlocked = true;
              second.el.pause();
            },
            () => {},
          );
        }
        first.el
          .play()
          .then(() => {
            started = true;
            cue.classList.remove("show");
            first.gain.gain.value = tracks[0].level;
            nowPlaying(tracks[0]);
            position();
            unlock.forEach((e) => removeEventListener(e, begin));
          })
          .catch(() => {});
      }

      video.addEventListener("ended", () => video.classList.add("settled"));

      const tom = [
        [0.4942, 0.891],
        [0.4699, 0.891],
        [0.4667, 0.8861],
        [0.4667, 0.8722],
        [0.4696, 0.8653],
        [0.4719, 0.8528],
        [0.4696, 0.8083],
        [0.4714, 0.7556],
        [0.4702, 0.7153],
        [0.4656, 0.7083],
        [0.4627, 0.6931],
        [0.4615, 0.6653],
        [0.4615, 0.6097],
        [0.4656, 0.5528],
        [0.4676, 0.5451],
        [0.4751, 0.5437],
        [0.476, 0.5333],
        [0.4812, 0.525],
        [0.4783, 0.5222],
        [0.4766, 0.5139],
        [0.4789, 0.5028],
        [0.4806, 0.4806],
        [0.4867, 0.4701],
        [0.4959, 0.4715],
        [0.5055, 0.4875],
        [0.5061, 0.4917],
        [0.5038, 0.5],
        [0.5038, 0.5069],
        [0.5014, 0.5125],
        [0.5003, 0.525],
        [0.5032, 0.5292],
        [0.5064, 0.5437],
        [0.5098, 0.5437],
        [0.513, 0.5486],
        [0.5165, 0.6097],
        [0.5165, 0.6931],
        [0.5136, 0.7083],
        [0.5095, 0.7181],
        [0.5078, 0.7583],
        [0.5095, 0.8111],
        [0.5061, 0.8611],
        [0.5078, 0.8736],
        [0.5046, 0.884],
      ];

      function inside(x, y, shape) {
        let hit = false;
        for (let i = 0, j = shape.length - 1; i < shape.length; j = i++) {
          const [xi, yi] = shape[i];
          const [xj, yj] = shape[j];
          if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
            hit = !hit;
          }
        }
        return hit;
      }

      function onTom({ clientX, clientY }) {
        if (!video.ended || !video.videoWidth) return false;
        const box = video.getBoundingClientRect();
        const [ox, oy] = getComputedStyle(video)
          .objectPosition.split(" ")
          .map((v) => parseFloat(v) / 100);
        const scale = Math.max(
          box.width / video.videoWidth,
          box.height / video.videoHeight,
        );
        const w = video.videoWidth * scale;
        const h = video.videoHeight * scale;
        const x = (clientX - box.left - (box.width - w) * ox) / w;
        const y = (clientY - box.top - (box.height - h) * oy) / h;
        return inside(x, y, tom);
      }

      let armed = false;

      addEventListener("pointerdown", (e) => {
        armed = started && onTom(e);
      });

      addEventListener("touchend", (e) => {
        if (armed && onTom(e.changedTouches[0])) skip(1);
        armed = false;
      });

      addEventListener("click", (e) => {
        if (armed && onTom(e)) skip(1);
        armed = false;
      });

      addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        video.style.cursor = started && onTom(e) ? "pointer" : "";
      });

      document.addEventListener("visibilitychange", () => {
        if (started && !held.length && !document.hidden) ctx.resume();
      });

      unlock.forEach((e) => addEventListener(e, begin));
      begin();
      setTimeout(() => {
        if (!started) cue.classList.add("show");
      }, 1500);
    </script>
  </body>
</html>
