<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000" />
    <link rel="stylesheet" href="styles.css" />
    <title>Goodbye</title>
  </head>

  <body>
    <video autoplay muted playsinline preload="auto" poster="media/poster.jpg">
      <source src="media/scene1.mp4" type="video/mp4" />
    </video>

    <button class="cue" aria-label="play sound">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path
          d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <script>
      const FADE = 10;
      const tracks = ["media/Hero.mp3", "media/Quelqu'un m'a dit.mp3"];
      const unlock = [
        "pointerdown",
        "pointerup",
        "touchend",
        "click",
        "keydown",
      ];

      const video = document.querySelector("video");
      const cue = document.querySelector(".cue");

      if (navigator.audioSession) navigator.audioSession.type = "playback";

      const ctx = new AudioContext();
      const players = tracks.map((src) => {
        const el = new Audio(encodeURI(src));
        el.preload = "auto";
        const gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(el).connect(gain).connect(ctx.destination);
        return { el, gain };
      });

      let current = 0;
      let fading = false;
      let started = false;

      const rise = Array.from({ length: 256 }, (_, i) =>
        Math.sin(((i / 255) * Math.PI) / 2),
      );
      const fall = [...rise].reverse();

      function ramp(param, shape) {
        const t = ctx.currentTime;
        param.cancelScheduledValues(t);
        param.setValueCurveAtTime(Float32Array.from(shape), t, FADE);
      }

      function crossfade() {
        fading = true;
        const out = players[current];
        current = (current + 1) % players.length;
        const next = players[current];

        next.gain.gain.value = 0;
        next.el.currentTime = 0;
        next.el.play();
        ramp(next.gain.gain, rise);
        ramp(out.gain.gain, fall);

        setTimeout(
          () => {
            out.el.pause();
            fading = false;
          },
          FADE * 1000 + 200,
        );
      }

      players.forEach((p, i) => {
        p.el.addEventListener("timeupdate", () => {
          if (i !== current || fading || !p.el.duration) return;
          if (p.el.duration - p.el.currentTime <= FADE) crossfade();
        });
        p.el.addEventListener("ended", () => {
          if (i === current && !fading) crossfade();
        });
      });

      function begin() {
        if (started) return;
        if (video.paused && !video.ended) video.play().catch(() => {});
        ctx.resume();
        players[0].el
          .play()
          .then(() => {
            started = true;
            cue.classList.remove("show");
            players[0].gain.gain.value = 1;
            unlock.forEach((e) => removeEventListener(e, begin));
          })
          .catch(() => {});
      }

      document.addEventListener("visibilitychange", () => {
        if (started && !document.hidden) ctx.resume();
      });

      unlock.forEach((e) => addEventListener(e, begin));
      begin();
      setTimeout(() => {
        if (!started) cue.classList.add("show");
      }, 1500);
    </script>
  </body>
</html>
